# Installed by install.sh from this repo (systemd/amux-serve.service.d/).
# Do not edit the installed copy; change the repo and re-run install.sh.
#
# amux-serve starts the tmux server, so tmux and every agent session can live
# in this unit's cgroup. The default KillMode=control-group made a plain
# `systemctl restart amux-serve` kill ALL of them (seen in practice: 8 sessions lost).
# KillMode=process signals only the python daemon on restart/stop; tmux
# survives and the restarted daemon adopts the existing sessions.
#
# Deliberate FULL stop (daemon + every session in this cgroup):
#   sudo systemctl kill --kill-whom=all amux-serve; sudo systemctl stop amux-serve
[Service]
KillMode=process
